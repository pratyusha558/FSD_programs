<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>using script tag</title>
</head>
<body>
  <h1>Script</h1>
  <p id="greet">HI</p>
  <button onclick="greet()">Click to greet</button>
  <script>
    function greet(){
      document.getElementById('greet').innerHTML='Hello';
    }
  </script>
</body>
</html>
