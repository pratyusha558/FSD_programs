<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Html Attributes</title>
</head>
<body>
  <h1>Attributes change</h1>
  <p>Js can also convert the attributes below is the example</p>
  <button onclick="document.getElementById('myImage').src='../images/pic_bulbon.gif'">Turn on the light</button>
  <img id="myImage" src='../images/pic_bulboff.gif' alt="bulb" style="width:100px">
  <button onclick="document.getElementById('myImage').src='../images/pic_bulboff.gif'">Turn off the light</button>
</body>
</html>
